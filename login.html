<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Σύνδεση — Hellas Heritage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" style="font-family:var(--font-serif);font-size:1.7rem;font-weight:700;color:var(--navy)">
        Hellas <span style="color:var(--gold)">Heritage</span>
      </a>
      <p id="auth-subtitle" style="font-size:.875rem;color:var(--grey-400);margin-top:.3rem">Καλώς ήρθες πίσω</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Σύνδεση</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Εγγραφή</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between">
          Κωδικός <a href="#" style="font-weight:400;color:var(--navy);font-size:.8rem">Ξέχασα τον κωδικό</a>
        </label>
        <input class="form-input" type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-navy" style="width:100%;justify-content:center;margin-top:.5rem">Σύνδεση</button>
      <div class="form-divider">ή</div>
      <button type="button" class="btn-google" onclick="showToast('Google login υπό κατασκευή')">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Συνέχεια με Google
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" style="display:none" onsubmit="handleRegister(event)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <div class="form-group">
          <label class="form-label">Όνομα</label>
          <input class="form-input" type="text" placeholder="Γιώργος" required>
        </div>
        <div class="form-group">
          <label class="form-label">Επώνυμο</label>
          <input class="form-input" type="text" placeholder="Ιωαννίδης" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Κωδικός</label>
        <input class="form-input" type="password" placeholder="Τουλάχιστον 8 χαρακτήρες" required minlength="8">
      </div>
      <div class="form-group" style="display:flex;align-items:flex-start;gap:.5rem">
        <input type="checkbox" id="agree" style="margin-top:.2rem" required>
        <label for="agree" style="font-size:.82rem;color:var(--grey-600)">Συμφωνώ με τους <a href="#" style="color:var(--navy)">Όρους Χρήσης</a> και την <a href="#" style="color:var(--navy)">Πολιτική Απορρήτου</a></label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Δημιουργία Λογαριασμού</button>
      <div class="form-divider">ή</div>
      <button type="button" class="btn-google" onclick="showToast('Google login υπό κατασκευή')">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Εγγραφή με Google
      </button>
    </form>

    <p style="text-align:center;font-size:.78rem;color:var(--grey-400);margin-top:1.25rem">
      Με την εγγραφή σου, αποδέχεσαι τους Όρους Χρήσης μας. Χωρίς spam. Ποτέ.
    </p>
  </div>
</div>
<div id="toast"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function switchTab(t) {
  document.getElementById('login-form').style.display    = t === 'login'    ? 'block' : 'none';
  document.getElementById('register-form').style.display = t === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', t === 'login');
  document.getElementById('tab-register').classList.toggle('active', t === 'register');
  document.getElementById('auth-subtitle').textContent = t === 'login' ? 'Καλώς ήρθες πίσω' : 'Δημιούργησε δωρεάν λογαριασμό';
}
function handleLogin(e)    { e.preventDefault(); showToast('✓ Σύνδεση επιτυχής!'); setTimeout(() => location.href='index.html', 1200); }
function handleRegister(e) { e.preventDefault(); showToast('✓ Ο λογαριασμός δημιουργήθηκε!'); setTimeout(() => location.href='index.html', 1200); }

// Check if URL has ?tab=register
if (new URLSearchParams(location.search).get('tab') === 'register') switchTab('register');
</script>
</body>
</html>
